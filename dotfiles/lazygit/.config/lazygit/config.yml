git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --side-by-side
customCommands:
  - key: C
    context: localBranches
    description: Create pull request
    loadingText: Creating pull request…
    command: >-
      git push --set-upstream origin {{.SelectedLocalBranch.Name | quote}} && gh pr create --head {{.SelectedLocalBranch.Name | quote}} --fill
    output: popup
# catppuccin mocha-blue: https://github.com/catppuccin/lazygit
gui:
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"
