worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[pre-switch]
pull-main = 'if [ "{{ cwd }}" = "{{ primary_worktree_path }}" ] && git -C "{{ primary_worktree_path }}" rev-parse --verify HEAD >/dev/null 2>&1; then git -C "{{ primary_worktree_path }}" pull --ff-only origin "{{ default_branch }}"; fi'

[pre-start]
copy-mise = 'wt copy-mise "{{ primary_worktree_path }}" "{{ worktree_path }}"'
fix-terraform-import = 'wt fix-terraform-import "{{ primary_worktree_path }}" "{{ worktree_path }}"'

[post-remove]
delete-session = 'wt delete-session "{{ repo }}" "{{ branch }}"'
