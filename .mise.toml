[tasks.zellij]
description = "zellij"
run = 'if common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null) && branch=$(git branch --show-current 2>/dev/null); then zellij --layout code attach --create "$(basename "$(dirname "$common_dir")")-$branch"; fi'

[hooks]
enter = 'if [ -z "${ZELLIJ:-}" ]; then mise run zellij; fi'
